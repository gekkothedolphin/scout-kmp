org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
# iosX64 (Intel simulator) target can't build native binaries on Apple Silicon hosts;
# suppress the warning rather than dropping the target (keeps CI/other-arch dev
# machines able to build it).
kotlin.native.ignoreDisabledTargets=true
